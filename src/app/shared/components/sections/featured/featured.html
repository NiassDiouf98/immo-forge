<section id="properties" class="bg-stone py-20">
  <div class="mx-auto max-w-7xl px-6">
    <div class="mb-12 flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="eyebrow">À la une</p>
        <h2 class="section-title">Propriétés en vedette</h2>
        <p class="mt-2 text-gray-500">Nos derniers biens, validés et prêts à visiter.</p>
      </div>
      <a routerLink="/properties" class="btn btn-outline">
        Voir tous les biens <span class="material-icons !text-lg">arrow_forward</span>
      </a>
    </div>

    <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
      @if (loading()) {
        @for (i of [1, 2, 3]; track i) { <div class="h-[26rem] animate-pulse rounded-2xl bg-white"></div> }
      } @else {
        @for (p of properties(); track p.id) { <app-property-card [bien]="p" /> }
        @empty { <p class="col-span-full py-10 text-center text-gray-500">Aucun bien publié pour le moment.</p> }
      }
    </div>
  </div>
</section>
