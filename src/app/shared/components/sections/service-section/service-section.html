<section id="services" class="bg-white py-20">
  <div class="mx-auto max-w-7xl px-6">
    <div class="mx-auto mb-14 max-w-2xl text-center">
      <p class="eyebrow">Pourquoi ImmoForge</p>
      <h2 class="section-title">Une plateforme complète</h2>
      <p class="mt-3 text-gray-500">Tout ce qu'il faut pour chercher, publier et gérer, au même endroit.</p>
    </div>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (s of services; track s.title) {
        <div class="group rounded-2xl border border-gray-100 bg-stone/60 p-7 transition duration-300 hover:-translate-y-1 hover:border-secondary/60 hover:bg-white hover:shadow-card-hover">
          <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary text-white transition group-hover:bg-secondary group-hover:text-charcoal">
            <mat-icon>{{ s.icon }}</mat-icon>
          </div>
          <h3 class="mb-2 text-lg font-semibold text-charcoal">{{ s.title }}</h3>
          <p class="text-sm leading-relaxed text-gray-500">{{ s.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
