<section id="testimonials" class="bg-white py-20">
  <div class="mx-auto max-w-7xl px-6">
    <div class="mx-auto mb-14 max-w-2xl text-center">
      <p class="eyebrow">Témoignages</p>
      <h2 class="section-title">Ils nous font confiance</h2>
    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
      @for (t of testimonials; track t.name) {
        <figure class="flex flex-col rounded-2xl border border-gray-100 bg-stone/60 p-8">
          <span class="material-icons mb-4 !text-4xl text-secondary">format_quote</span>
          <blockquote class="flex-1 leading-relaxed text-gray-700">{{ t.message }}</blockquote>
          <figcaption class="mt-6 flex items-center gap-4">
            <img [src]="t.image" [alt]="t.name" class="h-12 w-12 rounded-full object-cover ring-2 ring-secondary/40" loading="lazy" />
            <div>
              <div class="font-semibold text-charcoal">{{ t.name }}</div>
              <div class="text-xs text-gray-500">{{ t.role }}</div>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
